# Checks the Cluenori deployment every 5 minutes and alerts its owners when it's down. Runs only on
# its schedule, by hand, and as the next run of itself: never for a pull request, so no fork's code
# ever sees these secrets.
#
# A watching run checks every 5 minutes for 55 minutes, then starts the next watching run, so the
# watch goes on whether or not GitHub's schedule starts runs (it may start them late, skip them, or,
# for a new repository, not start them at all). The schedule stays, to start the chain again if it
# ever breaks. Runs are short because a run reads its secrets when it is queued: a phone removed, or
# a key set again, reaches the checks with the next run, within the hour. To stop watching, disable
# this workflow; a run cancelled by hand starts no next one.
name: Watch

on:
  schedule:
    # Every 5 minutes, GitHub's shortest, in the plain form GitHub documents. GitHub may start a run
    # late or skip one under load, and may take a while to start a new repository's schedule at all.
    - cron: "*/5 * * * *"
    # Once a week: enables this workflow again, so GitHub's rule that stops schedules in a public
    # repository after 60 days without activity never stops it.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch: check now, and alert on a change. test: send a test through every channel."
        type: choice
        options: [watch, test]
        default: watch
      dry_run:
        description: "Show exactly what each channel would send, and send and write nothing."
        type: boolean
        default: false
      minutes:
        description: "watch: how long this run checks before it starts the next, at most 55. Shorter only to try a handover."
        type: number
        default: 55

# Nothing, unless a job asks for it.
permissions: {}

jobs:
  watch:
    if: github.event.schedule != '17 4 * * 1'
    runs-on: ubuntu-24.04
    # A watching run checks for 55 minutes, and its last check takes a few more.
    timeout-minutes: 65
    # Every run that writes the outage's state is in `watch`, one at a time, so two never act on the
    # same outage: a run that comes while one watches waits, replacing any run already waiting, and
    # never cancels the one watching. A test or a dry run writes no state, and runs on its own.
    concurrency:
      group: ${{ ((inputs.mode || 'watch') == 'watch' && !inputs.dry_run) && 'watch' || format('watch-once-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      # Reading this repository's code, and the outage's issue: opening, updating and closing it.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # The two runtime dependencies at the lockfile's versions, without their install scripts.
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      # Watching: a check every 5 minutes (watch-loop.sh). A test or a dry run: once.
      - run: if [ "$LOOP" = true ]; then ./watch-loop.sh; else node src/main.ts; fi
        env:
          LOOP: ${{ ((inputs.mode || 'watch') == 'watch' && !inputs.dry_run) && 'true' || 'false' }}
          LOOP_MINUTES: ${{ inputs.minutes || 55 }}
          MODE: ${{ inputs.mode || 'watch' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          GITHUB_TOKEN: ${{ github.token }}
          CLUENORI_URL: ${{ secrets.CLUENORI_URL }}
          CLUENORI_APNS_KEY: ${{ secrets.CLUENORI_APNS_KEY }}
          CLUENORI_PHONES: ${{ secrets.CLUENORI_PHONES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  # Starts the next watching run once this one is done, whether its checks all passed or not; it then
  # waits for nothing, as `watch` has ended. Its own job, so the token that may start runs never
  # reaches the checks, and the checks' secrets never reach it. Only after `watch` ran: not after a
  # run cancelled by hand, nor after one whose `watch` was cancelled while it waited, replaced by a
  # newer run (`!cancelled()` alone doesn't say that), which would start runs that start runs.
  next:
    needs: watch
    if: ${{ !cancelled() && (needs.watch.result == 'success' || needs.watch.result == 'failure') && github.event.schedule != '17 4 * * 1' && (inputs.mode || 'watch') == 'watch' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Starting this workflow; nothing else.
      actions: write
    steps:
      - run: |
          for _ in 1 2 3 4 5; do
            if gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=watch; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::The next watching run couldn't be started: nothing watches Cluenori until one starts (by hand, or on GitHub's schedule)."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  keepalive:
    if: github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      # Enabling this workflow; nothing else.
      actions: write
    steps:
      - run: gh workflow enable watch.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
